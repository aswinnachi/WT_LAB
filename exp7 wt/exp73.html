<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card Effects</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #eef5ff, #f7f0ff);
            font-family: Arial, sans-serif;
        }

        .container {
            width: 420px;
        }

        .product-card {
            position: relative;
            background: #ffffff;
            border: 1px solid #dfe7f5;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 18px 40px rgba(87, 92, 131, 0.15);
            overflow: hidden;
        }

        .product-card::before {
            content: "";
            position: absolute;
            inset: 0 0 auto 0;
            height: 8px;
            background: linear-gradient(90deg, #4f46e5, #8b5cf6, #ec4899);
        }

        .tag {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 999px;
            background: #e8f8ee;
            color: #15803d;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }

        .product-name {
            margin: 0;
            font-size: 28px;
            color: #1f2937;
            line-height: 1.2;
        }

        .product-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 18px 0 14px;
            gap: 12px;
        }

        .price {
            font-size: 32px;
            font-weight: 700;
            color: #111827;
        }

        .category {
            background: #eef2ff;
            color: #4338ca;
            font-size: 13px;
            font-weight: 700;
            padding: 7px 12px;
            border-radius: 999px;
        }

        .status {
            display: inline-block;
            margin-bottom: 12px;
            padding: 7px 12px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
        }

        .in-stock {
            background: #eafaf0;
            color: #0f9f6e;
        }

        .description {
            margin: 0;
            color: #4b5563;
            line-height: 1.6;
            font-size: 15px;
        }

        .button-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            background: #4f46e5;
            color: white;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 18px rgba(79, 70, 229, 0.25);
        }

        button:hover {
            transform: translateY(-1px);
        }

        .status-text {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
            color: #374151;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="productCard" class="product-card">
            <div class="tag">Best Seller</div>
            <h1 class="product-name">Wireless Noise Cancelling Headphones</h1>

            <div class="product-meta">
                <span class="price">$249.99</span>
                <span class="category">Electronics</span>
            </div>

            <div class="status in-stock">In Stock</div>
            <p class="description">
                Premium over-ear headphones with immersive sound, deep bass, and a
                30-hour battery life. Designed for work, travel, and entertainment.
            </p>
        </div>

        <div class="button-panel">
            <button id="hideBtn">Hide</button>
            <button id="showBtn">Show</button>
            <button id="fadeBtn">Fade</button>
            <button id="slideBtn">Slide</button>
            <button id="animateBtn">Animate</button>
            <button id="stopBtn">Stop Animation</button>
            <button id="callbackBtn">Callback</button>
            <button id="chainBtn">Chaining</button>
        </div>

        <div id="statusText" class="status-text">Ready to apply jQuery effects.</div>
    </div>

    <script>
        $(document).ready(function () {
            const $card = $('#productCard');
            const $statusText = $('#statusText');

            $('#hideBtn').click(function () {
                $card.hide(600);
                $statusText.text('The product card is hidden.');
            });

            $('#showBtn').click(function () {
                $card.show(600);
                $statusText.text('The product card is visible again.');
            });

            $('#fadeBtn').click(function () {
                $card.fadeOut(600, function () {
                    $statusText.text('Fade effect completed.');
                    $card.fadeIn(600);
                });
            });

            $('#slideBtn').click(function () {
                $card.slideToggle(700);
                $statusText.text('Slide effect applied.');
            });

            $('#animateBtn').click(function () {
                $card.animate({
                    left: '20px',
                    opacity: '0.7',
                    width: '+=20px'
                }, 500).animate({
                    left: '0px',
                    opacity: '1',
                    width: '-=20px'
                }, 500);
                $statusText.text('Animation is running.');
            });

            $('#stopBtn').click(function () {
                $card.stop(true, true);
                $statusText.text('Animation stopped.');
            });

            $('#callbackBtn').click(function () {
                $card.hide(500, function () {
                    $statusText.text('Callback: the card has finished hiding.');
                    $card.show(500);
                });
            });

            $('#chainBtn').click(function () {
                $card.css('border-color', '#f59e0b')
                    .slideUp(300)
                    .slideDown(500)
                    .animate({ borderLeftWidth: '10px' }, 200)
                    .animate({ borderLeftWidth: '1px' }, 200);
                $statusText.text('Chained effects executed successfully.');
            });
        });
    </script>
</body>
</html>
