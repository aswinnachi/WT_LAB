<!DOCTYPE html><html><head><title>Sample</title><style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial}
.header{height:250px;background:url('banner.jpeg') center/cover;padding:20px}.header img{width:90px}
.menu{display:flex;background:#999}.menu a{flex:1;padding:15px;text-align:center;text-decoration:none;color:#000}.menu a:first-child,.menu a:hover{background:red;color:#fff}
.content{background:pink;padding:30px;display:flex;justify-content:center}
table{border-collapse:collapse;width:250px;border-radius:20px;overflow:hidden}th{background:green;color:#fff;padding:10px}td{text-align:center;padding:12px}tr:nth-child(even){background:green;color:#fff}tr:nth-child(odd){background:greenyellow}
.login{background:url('bg.jpeg') center/cover;padding:60px;display:flex;justify-content:center;gap:40px}.box{background:#fff;width:260px;padding:20px;border-radius:15px}.box h2{text-align:center;margin-bottom:20px}.box input{width:100%;padding:10px;margin:8px 0}button{width:100%;padding:10px;background:#06f;color:#fff;border:none}.footer{background:#ffe4c4;text-align:center;padding:20px}
</style></head><body>
<div class='header'><img src='apple.jpeg'></div>
<div class='menu'><a href=#>Home</a><a href=#>About</a><a href=#>School</a><a href=#>Others</a></div>
<div class='content'><table><tr><th colspan=2>Favourite</th></tr>
<tr><td>Item1</td><td><img src='apple.jpeg' width=40></td></tr>
<tr><td>Item2</td><td><img src='apple.jpeg' width=40></td></tr>
<tr><td>Item3</td><td><img src='apple.jpeg' width=40></td></tr>
<tr><td>Item4</td><td><img src='apple.jpeg' width=40></td></tr>
</table></div>
<div class='login'><div class='box'><h2>Sign In</h2><input placeholder='Username'><input type=password placeholder='Password'><button>Sign In</button></div>
<div class='box'><h2>Sign Up</h2><input placeholder='Name'><input type=email placeholder='Email'><input type=password placeholder='Password'><button>Sign Up</button></div></div>
<div class='footer'><p><i>Your address</i></p><p>©2020-2021 (Register Number) - Web Technology Lab Batch 1</p></div>
</body></html>
