<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      color: #222;
      font-family: Arial, sans-serif;
    }
    .header {
      height: 250px;
      padding: 20px;
      background: url('banner.jpeg') center / cover;
    }
    .header img { width: 90px; height: auto; }
    .menu { display: flex; background: #999; }
    .menu a {
      flex: 1;
      padding: 15px;
      color: #000;
      text-align: center;
      text-decoration: none;
      transition: background-color 0.2s ease;
    }
    .menu a:first-child,
    .menu a:hover { color: #fff; background: red; }
    .content {
      display: flex;
      justify-content: center;
      padding: 30px;
      background: pink;
    }
    table {
      width: 250px;
      overflow: hidden;
      border-collapse: collapse;
      border-radius: 20px;
    }
    th { padding: 10px; color: #fff; background: green; }
    td { padding: 12px; text-align: center; }
    tr:nth-child(even) { color: #fff; background: green; }
    tr:nth-child(odd) { background: greenyellow; }
    .login {
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 60px;
      background: url('bg.jpeg') center / cover;
    }
    .box {
      width: 260px;
      padding: 20px;
      background: #fff;
      border-radius: 15px;
    }
    .box h2 { margin-bottom: 20px; text-align: center; }
    .box input { width: 100%; margin: 8px 0; padding: 10px; }
    button {
      width: 100%;
      padding: 10px;
      color: #fff;
      cursor: pointer;
      background: #06f;
      border: none;
    }
    .footer { padding: 20px; text-align: center; background: #ffe4c4; }
    .footer p + p { margin-top: 8px; }
    @media (max-width: 600px) {
      .menu,
      .login { flex-direction: column; }
      .login { align-items: center; gap: 20px; padding: 30px 20px; }
      .box { width: min(100%, 320px); }
    }
  </style>
</head>
<body>
  <header class="header">
    <img src="apple.jpeg" alt="Apple logo">
  </header>

  <nav class="menu" aria-label="Main navigation">
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#school">School</a>
    <a href="#others">Others</a>
  </nav>

  <main>
    <section class="content" id="home">
      <table>
        <thead>
          <tr>
            <th colspan="2">Favourite</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Item 1</td>
            <td><img src="apple.jpeg" width="40" alt="Apple"></td>
          </tr>
          <tr>
            <td>Item 2</td>
            <td><img src="apple.jpeg" width="40" alt="Apple"></td>
          </tr>
          <tr>
            <td>Item 3</td>
            <td><img src="apple.jpeg" width="40" alt="Apple"></td>
          </tr>
          <tr>
            <td>Item 4</td>
            <td><img src="apple.jpeg" width="40" alt="Apple"></td>
          </tr>
        </tbody>
      </table>
    </section>

    <section class="login" id="about">
      <form class="box" action="#" method="post">
        <h2>Sign In</h2>
        <input type="text" name="username" placeholder="Username" aria-label="Username">
        <input type="password" name="password" placeholder="Password" aria-label="Password">
        <button type="submit">Sign In</button>
      </form>

      <form class="box" action="#" method="post">
        <h2>Sign Up</h2>
        <input type="text" name="name" placeholder="Name" aria-label="Name">
        <input type="email" name="email" placeholder="Email" aria-label="Email">
        <input type="password" name="new-password" placeholder="Password" aria-label="Password">
        <button type="submit">Sign Up</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <p><i>Your address</i></p>
    <p>© 2020–2021 (Register Number) - Web Technology Lab Batch 1</p>
  </footer>
</body>
</html>
