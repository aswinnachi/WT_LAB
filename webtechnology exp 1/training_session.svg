<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <!-- Background office wall -->
  <rect width="800" height="450" fill="#f8fafc" rx="12"/>
  
  <!-- Modern office window frame background lines -->
  <line x1="120" y1="0" x2="120" y2="300" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="280" y1="0" x2="280" y2="300" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="440" y1="0" x2="440" y2="300" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="0" y1="200" x2="440" y2="200" stroke="#e2e8f0" stroke-width="1.5"/>
  
  <!-- Presentation Screen / TV -->
  <rect x="480" y="45" width="290" height="190" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="6"/>
  <!-- Content on screen -->
  <text x="625" y="80" font-family="'Segoe UI', Arial, sans-serif" font-weight="bold" font-size="14" fill="#38bdf8" text-anchor="middle">Infosys</text>
  <text x="625" y="102" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Digital Skills Development</text>
  
  <!-- Icons on Screen with labels -->
  <!-- AI / ML -->
  <circle cx="525" cy="140" r="14" fill="#0284c7"/>
  <text x="525" y="144" font-family="sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">🤖</text>
  <text x="525" y="170" font-family="'Segoe UI', Arial" font-size="8" font-weight="bold" fill="#cbd5e1" text-anchor="middle">AI &amp; ML</text>
  
  <!-- Cloud -->
  <circle cx="575" cy="140" r="14" fill="#0d9488"/>
  <text x="575" y="144" font-family="sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">☁</text>
  <text x="575" y="170" font-family="'Segoe UI', Arial" font-size="8" font-weight="bold" fill="#cbd5e1" text-anchor="middle">Cloud</text>
  
  <!-- Security -->
  <circle cx="625" cy="140" r="14" fill="#b45309"/>
  <text x="625" y="144" font-family="sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">🛡️</text>
  <text x="625" y="170" font-family="'Segoe UI', Arial" font-size="8" font-weight="bold" fill="#cbd5e1" text-anchor="middle">Security</text>
  
  <!-- Full-Stack -->
  <circle cx="675" cy="140" r="14" fill="#475569"/>
  <text x="675" y="143" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">&lt;/&gt;</text>
  <text x="675" y="170" font-family="'Segoe UI', Arial" font-size="8" font-weight="bold" fill="#cbd5e1" text-anchor="middle">Web Dev</text>
  
  <!-- Data Science -->
  <circle cx="725" cy="140" r="14" fill="#1e3a8a"/>
  <text x="725" y="144" font-family="sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">📊</text>
  <text x="725" y="170" font-family="'Segoe UI', Arial" font-size="8" font-weight="bold" fill="#cbd5e1" text-anchor="middle">Data Sci</text>
  
  <!-- Presenter (Male standing) -->
  <!-- Body/Suit -->
  <path d="M 400 320 Q 395 240 415 220 L 445 220 Q 465 240 460 320 Z" fill="#2563eb"/>
  <!-- Shirt/Tie -->
  <path d="M 420 220 L 430 235 L 440 220 Z" fill="#ffffff"/>
  <path d="M 428 230 L 432 230 L 434 255 L 426 255 Z" fill="#dc2626"/>
  <!-- Head -->
  <circle cx="430" cy="190" r="20" fill="#fbcfe8"/>
  <!-- Hair -->
  <path d="M 410 185 Q 430 162 450 185 C 445 174 415 174 410 185" fill="#1e293b"/>
  <!-- Arm pointing to screen -->
  <path d="M 445 235 L 495 200 Q 500 196 496 190 L 490 193 L 445 225 Z" fill="#fbcfe8" stroke="#2563eb" stroke-width="1"/>
  
  <!-- Meeting Table -->
  <ellipse cx="250" cy="385" rx="230" ry="45" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Trainees (Sitting, showing heads/shoulders from back/side) -->
  <!-- Trainee 1 (Left, Female, dark hair, blue top) -->
  <path d="M 110 450 C 110 380 170 380 170 450 Z" fill="#475569"/>
  <circle cx="140" cy="360" r="22" fill="#fed7aa"/>
  <path d="M 115 350 Q 140 315 165 350 Q 160 385 120 380 Z" fill="#0f172a"/> <!-- Hair -->
  
  <!-- Trainee 2 (Middle-left, Male, brown hair, plaid/check shirt) -->
  <path d="M 210 450 C 210 375 270 375 270 450 Z" fill="#3b82f6"/>
  <circle cx="240" cy="350" r="22" fill="#ffedd5"/>
  <path d="M 220 338 C 230 330 250 330 260 338 C 265 345 255 348 240 345 Z" fill="#78350f"/> <!-- Hair -->
  
  <!-- Trainee 3 (Middle-right, Female, yellow shirt, dark hair) -->
  <path d="M 310 450 C 310 390 370 390 370 450 Z" fill="#eab308"/>
  <circle cx="340" cy="370" r="22" fill="#fdf2e9"/>
  <path d="M 315 365 C 320 330 360 330 365 365 C 370 395 310 395 315 365 Z" fill="#0f172a"/> <!-- Long hair -->

</svg>
